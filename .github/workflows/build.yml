name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -A x64 -DFREELFO_BENCH=ON   # no -G: CMake picks whichever Visual Studio the runner has (VS 2022 is no longer there)
      - name: Build VST3 and the audio tests
        run: cmake --build build --config Release --target FreeLfoTool_VST3 LfoAudioTest
      - name: Audio tests (null, silence, clicks, stability, timing, real-time safety)
        run: build/LfoAudioTest_artefacts/Release/LfoAudioTest.exe
      - uses: actions/upload-artifact@v4
        with:
          name: MUVMNT-LFO-windows-vst3
          path: build/FreeLfoTool_artefacts/Release/VST3/

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests (curve model, crossover)
        run: |
          clang++ -std=c++17 tests/envelope_test.cpp -o envtest && ./envtest
          clang++ -std=c++17 tests/crossover_test.cpp -o xotest && ./xotest
      # One build for Apple Silicon and Intel. Without a deployment target it would only run on the runner's own macOS or newer.
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DFREELFO_BENCH=ON "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Build VST3, Standalone and the audio tests
        run: cmake --build build --config Release --parallel --target FreeLfoTool_VST3 FreeLfoTool_Standalone LfoAudioTest
      - name: Audio tests (null, silence, clicks, stability, timing, real-time safety)
        run: build/LfoAudioTest_artefacts/Release/LfoAudioTest
      - name: Audio tests, Intel version (through Rosetta)
        run: arch -x86_64 build/LfoAudioTest_artefacts/Release/LfoAudioTest
      # Sign the whole bundle (ad hoc: no Apple developer account, so not notarised), then zip it here because
      # upload-artifact does not keep the file permissions a Mac plugin needs.
      - name: Package the Mac VST3
        run: |
          plugin="build/FreeLfoTool_artefacts/Release/VST3/MUVMNT LFO.vst3"
          codesign --force --deep --sign - "$plugin"
          codesign --verify --deep --strict "$plugin"
          lipo "$plugin/Contents/MacOS/MUVMNT LFO" -verify_arch arm64 x86_64
          ditto -c -k --keepParent "$plugin" MUVMNT-LFO-macos-vst3.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MUVMNT-LFO-macos-vst3
          path: MUVMNT-LFO-macos-vst3.zip
